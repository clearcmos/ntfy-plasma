name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Arch, because the Plasma 6 QML modules the widget imports are not
    # packaged for the Ubuntu runner images. The digest is bumped by hand;
    # pacman upgrades to current packages either way.
    container:
      image: archlinux:base@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6
    steps:
      - name: Install Qt 6, Plasma, and check tools
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed diffutils make jq python shellcheck actionlint qt6-declarative qt6-multimedia kirigami libplasma
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, format check, and tests
        run: make check
        env:
          QT_QPA_PLATFORM: offscreen

  ci-ok:
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo ok
